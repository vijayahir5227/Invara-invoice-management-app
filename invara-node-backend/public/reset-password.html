<!DOCTYPE html>
<html>
<head>
  <title>Reset Password</title>
</head>
<body>
  <h2>Reset Your Password</h2>
  <form id="resetForm">
    <input type="password" id="newPassword" placeholder="New Password" required /><br><br>
    <input type="password" id="confirmPassword" placeholder="Confirm Password" required /><br><br>
    <button type="submit">Submit</button>
  </form>

  <p id="message"></p>

  <script>
    // Get emailHash from URL
    const urlParams = new URLSearchParams(window.location.search);
    const emailHash = urlParams.get('emailHash');

    const form = document.getElementById('resetForm');
    const message = document.getElementById('message');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (newPassword !== confirmPassword) {
        message.textContent = 'Passwords do not match';
        return;
      }

      try {
        const res = await fetch('/api/user/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ emailHash, newPassword, confirmPassword })
        });
        const data = await res.json();
        if (res.ok) {
          message.style.color = 'green';
          message.textContent = data.message;
          form.reset();
        } else {
          message.style.color = 'red';
          message.textContent = data.error || 'Error resetting password';
        }
      } catch (err) {
        message.style.color = 'red';
        message.textContent = 'Failed to reset password';
      }
    });
  </script>
</body>
</html>
